name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch/PR are cancelled automatically.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    # Enforce the PR title convention (CONTRIBUTING.md): "BYTE-N: ..." or "Release ...".
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^(BYTE-[0-9]+:|Release) '; then
            echo "PR title must start with 'BYTE-N: ' (issue key) or 'Release ' (release PRs)."
            echo "Got: $TITLE"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Docs drift gate: root README must stay in sync with packages/
      # (package table + install list complete, no stale references).
      - run: node scripts/check-readme-packages.mjs
      - run: npm ci
      # Type-check any workspace that defines a `typecheck` script.
      - run: npm run typecheck --workspaces --if-present
      # Run every workspace's test suite (vitest).
      - run: npm test
      # Verify the source-loaded vendor extension and bundled skill are publishable.
      - run: npm --workspace @bytetrue/pi-vendor pack --dry-run
      - run: node packages/pi-image-gen/scripts/pack-smoke.mjs